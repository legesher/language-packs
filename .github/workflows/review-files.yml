# Checks the review files a pull request adds or changes under reviews/.
#
# Read-only: no secrets, no salt, no identity, no write token. The checks run
# through the published legesher-i18n package, the same reader the import
# uses after merge, and the report lands in the job summary and as an
# artifact. A maintainer still reads every review before merging.
name: Review files

on:
  pull_request:
    paths:
      - "reviews/**"

permissions:
  contents: read

concurrency:
  group: review-files-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # The legesher-i18n release this check runs; an exact pin, raised by hand.
  LEGESHER_I18N_VERSION: "0.28.3"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history: a review's pin is checked against every pin its
          # template under reference/ has ever carried.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # 3.13 or newer: the Unicode 15.1 identifier rules the Sinhala and
          # Japanese 3.13+ forms need.
          python-version: "3.13"

      - name: Install legesher-i18n
        run: python -m pip install "legesher-i18n==${LEGESHER_I18N_VERSION}"

      - name: Check the changed review files
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # quotePath off: a non-ASCII file name must reach the check as itself.
          git -c core.quotePath=false diff --name-only --diff-filter=AMR \
            "$BASE"...HEAD -- 'reviews/*/*' > changed.txt
          if [ ! -s changed.txt ]; then
            echo "No review files changed." | tee review-check.md
            exit 0
          fi
          # Templates and known pins come from the base commit, never from this
          # pull request's own files.
          xargs -d '\n' legesher-i18n check-review-files --author "$AUTHOR" \
            --base-ref "$BASE" --report review-check.md < changed.txt

      - name: Report
        if: always()
        run: |
          if [ -f review-check.md ]; then cat review-check.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: review-check
          path: review-check.md
          if-no-files-found: ignore
