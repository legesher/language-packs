name: Propose a Translation Option
description: Offer your word for a programming term in your language
title: '[Option]: TERM in LANGUAGE'
labels: [contrib:localization]
body:
- type: markdown
  attributes:
    value: |
      Thank you for offering a word. Every translation anyone offers is kept as an **option** in the
      shared map, alongside every other option for the same term. You are not competing with the
      word a pack ships today and you are not editing it: you are adding evidence.

      One form, one term. If you have words for twenty terms, the
      [pack review form](https://github.com/legesher/legesher-translations/issues/new?template=language_pack_review.yml) takes them in one go.

      **Before you submit:** [Your contributions and your data](https://github.com/legesher/legesher-translations/blob/main/CONTRIBUTOR_PRIVACY.md)
      is short and covers what happens to your word, how you are identified (you are not, unless you
      ask to be), and how to withdraw. The [reviewer guide](https://github.com/legesher/legesher-translations/blob/main/REVIEWING.md)
      explains how options become the word a pack ships.

      **A person reads this before it goes anywhere.** New submissions are screened by a maintainer
      before they become visible to other reviewers or exported to the public corpus. The queue is
      walked weekly at minimum. We would rather tell you a human does it than imply it is instant.

- type: input
  id: concept
  attributes:
    label: The term you are rendering
    description: The English keyword, builtin, or exception this word stands for.
    placeholder: e.g., def, while, ValueError, print
  validations:
    required: true

- type: dropdown
  id: language
  attributes:
    label: Your language
    options:
    - Amharic (am)
    - Arabic (ar)
    - Bengali (bn)
    - Bosnian (bs)
    - Burmese (my)
    - Catalan (ca)
    - Chinese (zh)
    - Croatian (hr)
    - Czech (cs)
    - Danish (da)
    - Dutch (nl)
    - English (en)
    - Finnish (fi)
    - French (fr)
    - Galician (gl)
    - German (de)
    - Greek (el)
    - Gujarati (gu)
    - Hebrew (he)
    - Hindi (hi)
    - Hungarian (hu)
    - Indonesian (id)
    - Irish (ga)
    - Italian (it)
    - Japanese (ja)
    - Kannada (kn)
    - Korean (ko)
    - Latvian (lv)
    - Macedonian (mk)
    - Malay (ms)
    - Malayalam (ml)
    - Mongolian (mn)
    - Norwegian (no)
    - Persian (fa)
    - Polish (pl)
    - Portuguese (pt)
    - Romanian (ro)
    - Russian (ru)
    - Scottish Gaelic (gd)
    - Serbian (sr)
    - Sinhala (si)
    - Spanish (es)
    - Sundanese (su)
    - Swedish (sv)
    - Telugu (te)
    - Thai (th)
    - Turkish (tr)
    - Urdu (ur)
    - Uzbek (uz)
    - Vietnamese (vi)
    - Welsh (cy)
    - Other (no pack yet)
  validations:
    required: true

- type: input
  id: other_language
  attributes:
    label: If you chose Other — your language
    description: |
      Name it and, if you know it, include its BCP 47 code so we register it correctly. A language
      with no pack yet is a welcome submission, not an edge case.
    placeholder: e.g., Tigrinya (ti)

- type: input
  id: surface_form
  attributes:
    label: Your word
    description: |
      The word as it would appear in code. It needs to work as an identifier: no spaces, no
      punctuation. If your rendering is naturally a phrase, put the phrase in the next field and a
      single-token contraction here.
    placeholder: e.g., definir
  validations:
    required: true

- type: input
  id: expansion
  attributes:
    label: The full phrase, if your word is a contraction
    description: |
      Some terms read as a phrase in full and contract to a token in code (`elif` is "else if").
      Both are useful: the phrase teaches, the contraction ships.
    placeholder: e.g., si no entonces si → sino_si

- type: dropdown
  id: provenance
  attributes:
    label: Where this word comes from
    description: |
      All four are welcome. This is a description, not a ranking.
    options:
    - Established usage (classrooms, textbooks, or working programmers already say this)
    - Coinage (no word existed, so I built one)
    - Loanword or cognate (my language genuinely borrows this word)
    - Transliteration (a phonetic copy of the English, which my community actually prefers)
  validations:
    required: true

- type: checkboxes
  id: descriptors
  attributes:
    label: Anything else that describes this word
    description: Tick what applies. Nothing here counts against your word.
    options:
    - label: Regional (specific to a variety or region of this language)
    - label: Formal register
    - label: Informal or conversational register

- type: textarea
  id: rationale
  attributes:
    label: Why this word
    description: |
      What makes this the right rendering? How would you explain the concept to a student using it?
      This is often the most valuable part of the submission, and it stays in the record whether or
      not your word ends up being the one a pack ships.
    placeholder: |
      e.g., "definir" is the verb a Spanish CS textbook uses for declaring a function, and it reads
      as an instruction rather than a noun, which matches what `def` does.
  validations:
    required: true

- type: dropdown
  id: assistance
  attributes:
    label: Did an AI assistant help you with this word?
    description: |
      Both answers are fine. We record how a word was produced so the corpus stays honest about its
      own provenance. See [AI-Assisted Contributions](https://github.com/legesher/legesher-translations/blob/main/AI_CONTRIBUTIONS.md).
    options:
    - No, this is my own rendering
    - Yes, an assistant suggested or helped shape it
  validations:
    required: true

- type: input
  id: assistant_name
  attributes:
    label: Which assistant, if you used one
    description: Leave blank if you did not. A machine proposal is recorded with the machine named.
    placeholder: e.g., Claude Opus 4.5, GPT-4o, a local model

- type: dropdown
  id: credit
  attributes:
    label: How would you like to be credited?
    description: |
      Anonymous is the default and costs you nothing: your contribution counts exactly the same.
      You can change this later by asking.
    options:
    - Anonymous (default)
    - My GitHub handle
    - A display name I will give you
  validations:
    required: true

- type: input
  id: credit_text
  attributes:
    label: Your display name, if you chose one
    description: |
      Only used when you picked "A display name I will give you" above. If that is your choice and
      this field is blank, we record you as anonymous until you give us the name — here or at
      contribute@legesher.com, whichever you prefer.
    placeholder: e.g., Dr. A. Translator

- type: checkboxes
  id: consent
  attributes:
    label: Consent
    options:
    - label: I have read [Your contributions and your data](https://github.com/legesher/legesher-translations/blob/main/CONTRIBUTOR_PRIVACY.md) (v1.0) and agree
      required: true
    - label: I agree to follow this project's [Code of Conduct](https://github.com/legesher/legesher-translations/blob/main/CODE_OF_CONDUCT.md)
      required: true

- type: markdown
  attributes:
    value: |
      **Do not put an email address in this issue.** GitHub issues are public and we do not collect
      contact details on a public surface. If you would like us to be able to reach you about your
      contribution, or you have a privacy or credit question, write to
      <contribute@legesher.com> and mention this issue.

- type: markdown
  attributes:
    value: |
      **What happens next:** a maintainer reads this, then your issue is closed with a reply naming
      exactly what landed. Closed means recorded, never rejected — a submission that needs more
      eyes is held, and the reply says so.
